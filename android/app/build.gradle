plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load signing properties from key.properties (local) or environment variables (CI)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.stockswipe.stockswipe"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    signingConfigs {
        release {
            // Prefer CI env vars; fall back to key.properties for local builds
            keyAlias     = System.getenv("KEY_ALIAS")     ?: keystoreProperties["keyAlias"]
            keyPassword  = System.getenv("KEY_PASSWORD")  ?: keystoreProperties["keyPassword"]
            storeFile    = file(System.getenv("KEYSTORE_PATH") ?: keystoreProperties["storeFile"] ?: "keystore.jks")
            storePassword = System.getenv("STORE_PASSWORD") ?: keystoreProperties["storePassword"]
        }
    }

    defaultConfig {
        applicationId = "com.stockswipe.stockswipe"
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Enable R8 full-mode minification so the Play Store can generate a
            // deobfuscation (mapping) file and analyse crashes/ANRs correctly.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
        }
    }

    // Package FULL native debug symbols in the App Bundle so the Play Store can
    // analyse native crashes and ANRs without a separate symbol upload.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
