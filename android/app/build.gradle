plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load signing properties from key.properties (local) or environment variables (CI)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.stockswipe.stockswipe"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    signingConfigs {
        release {
            // Prefer CI env vars; fall back to key.properties for local builds
            keyAlias     = System.getenv("KEY_ALIAS")     ?: keystoreProperties["keyAlias"]
            keyPassword  = System.getenv("KEY_PASSWORD")  ?: keystoreProperties["keyPassword"]
            storeFile    = file(System.getenv("KEYSTORE_PATH") ?: keystoreProperties["storeFile"] ?: "keystore.jks")
            storePassword = System.getenv("STORE_PASSWORD") ?: keystoreProperties["storePassword"]
        }
    }

    defaultConfig {
        applicationId = "com.stockswipe.stockswipe"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
