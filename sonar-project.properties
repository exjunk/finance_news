# SonarQube / SonarCloud project configuration
# ---------------------------------------------------------------------------
# Project identification
# ---------------------------------------------------------------------------
sonar.projectKey=stockswipe
sonar.organization=stockswipe          # ← replace with your SonarCloud org key
sonar.projectName=StockSwipe
sonar.projectVersion=1.0.0

# ---------------------------------------------------------------------------
# Source & test paths
# ---------------------------------------------------------------------------
sonar.sources=lib
sonar.tests=test

# ---------------------------------------------------------------------------
# Coverage
# Flutter test --coverage generates an LCOV report at coverage/lcov.info
# ---------------------------------------------------------------------------
sonar.dart.lcov.reportPaths=coverage/lcov.info

# ---------------------------------------------------------------------------
# Exclusions
# Generated files (.g.dart, .drift.dart) and assets must not be analysed.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  lib/**/*.g.dart,\
  lib/**/*.drift.dart,\
  lib/**/*.freezed.dart,\
  lib/**/*.mocks.dart,\
  assets/**

sonar.test.exclusions=\
  test/helpers/**

# ---------------------------------------------------------------------------
# Language
# ---------------------------------------------------------------------------
sonar.language=dart

# ---------------------------------------------------------------------------
# Encoding
# ---------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8
