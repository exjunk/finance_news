name: finswipe
description: Swipe through Indian stock market news
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  xml: ^6.3.0

  # Database
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.15
  path_provider: ^2.1.2
  path: ^1.9.0

  # UI
  google_fonts: ^6.1.0
  appinio_swiper: ^2.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  animated_flip_counter: ^0.3.2
  percent_indicator: ^4.2.3

  # Utilities
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  webview_flutter: ^4.4.2
  intl: ^0.19.0
  crypto: ^3.0.3
  html: ^0.15.4
  in_app_review: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  drift_dev: ^2.23.0
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/stock_swipe_icon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/stock_swipe_icon.png"

flutter_native_splash:
  color: "#121212"
  image: "assets/images/stock_swipe_icon.png"
  android_12:
    image: "assets/images/stock_swipe_icon.png"
    icon_background_color: "#121212"
